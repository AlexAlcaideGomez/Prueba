# La swap vive en RAM comprimida (zram): usarla es barato, así que se deja
# que el kernel la aproveche antes de descartar la caché de disco.
vm.swappiness = 100
# zram no se beneficia de leer páginas por adelantado.
vm.page-cluster = 0
# Conserva más tiempo en caché la información de directorios e inodos.
vm.vfs_cache_pressure = 50
